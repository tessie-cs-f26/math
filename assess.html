<title>Math Placement Assessments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f6fb;--surface:#ffffff;--ink:#1d2540;--muted:#5b6482;--line:#d6dcea;
  --t1:#3d6fd9;--t2:#f0b23a;--t3:#4fb393;--focus:#3d6fd9;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#121829;--surface:#1b2338;--ink:#e8ebf4;--muted:#9ba4bf;--line:#2f3956;
    --t1:#6690f0;--t2:#f2c15a;--t3:#5ec7a4;--focus:#9db9ff;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#121829;--surface:#1b2338;--ink:#e8ebf4;--muted:#9ba4bf;--line:#2f3956;
  --t1:#6690f0;--t2:#f2c15a;--t3:#5ec7a4;--focus:#9db9ff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.125rem;line-height:1.5}
main{max-width:46rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:1rem;margin:.25rem 0 1.25rem}
.brand .logo{height:42px;width:auto;display:block}
h1{font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.05;margin:.2rem 0 .6rem;letter-spacing:-.01em}
h1{margin-bottom:1.5rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
a.test{display:flex;align-items:center;gap:1rem;text-decoration:none;color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-radius:18px;padding:1rem 1.2rem}
a.test:hover{border-color:var(--t1)}
a.test:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.lvl{flex:none;width:3.2rem;height:3.2rem;display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff;
  background:var(--t1);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
li:nth-child(3n+2) .lvl{background:var(--t3)}li:nth-child(3n) .lvl{background:var(--t2);color:#2b1f05}
.test strong{display:block;font-size:1.3rem}
.test span.d{color:var(--muted);font-size:1rem}
.more{color:var(--muted);margin-top:1.5rem;font-size:1rem}
</style>
</head>
