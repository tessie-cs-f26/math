<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level 4 Math Placement Check (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f6fb;--surface:#ffffff;--ink:#1d2540;--muted:#5b6482;--line:#d6dcea;--soft:#cdd3e0;
  --t1:#3d6fd9;--t2:#f0b23a;--t3:#4fb393;--copper:#d0956a;--focus:#3d6fd9;--good:#257a5e;--bad:#b23a32;
  --sel:#e6eefc;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121829;--surface:#1b2338;--ink:#e8ebf4;--muted:#9ba4bf;--line:#2f3956;--soft:#5a6380;
    --t1:#6690f0;--t2:#f2c15a;--t3:#5ec7a4;--copper:#c98d62;--focus:#9db9ff;--good:#6fd3ae;--bad:#f08a7f;
    --sel:#243259;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121829;--surface:#1b2338;--ink:#e8ebf4;--muted:#9ba4bf;--line:#2f3956;--soft:#5a6380;
  --t1:#6690f0;--t2:#f2c15a;--t3:#5ec7a4;--copper:#c98d62;--focus:#9db9ff;--good:#6fd3ae;--bad:#f08a7f;
  --sel:#243259;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:1.125rem;line-height:1.5}
main{max-width:46rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:1rem;margin:.25rem 0 1.25rem}
.brand .logo{height:42px;width:auto;display:block}
h1{font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.05;margin:.2rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.6rem;line-height:1.15;margin:0 0 .5rem}
p{margin:0 0 1rem}
.lede{font-size:1.3rem;color:var(--muted);max-width:34rem}
label{display:block;font-weight:700;margin-bottom:.35rem}
input[type=text],input.num{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem}
input[type=text]{font-size:1.35rem;width:min(100%,22rem)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.check{display:flex;gap:.6rem;align-items:center;font-weight:400;margin:1rem 0 1.5rem}
.check input{width:1.3rem;height:1.3rem;accent-color:var(--t1)}
button{font:inherit;cursor:pointer}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:.8rem 1.8rem;font-size:1.25rem;font-weight:700}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:.6rem 1.2rem;font-size:1.05rem}
.teacher-note{margin-top:2.5rem;border-top:2px solid var(--line);padding-top:1rem;color:var(--muted);font-size:1rem}
.teacher-note summary{cursor:pointer;font-weight:700;color:var(--ink)}
.teacher-note p{margin:.6rem 0 0;max-width:38rem}

.progress{display:flex;justify-content:center;margin:0 0 1rem}
.progress .hex{transition:fill .35s ease}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.4rem 1.4rem 1.2rem}
.qhead{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between}
.q{font-size:clamp(1.35rem,3.6vw,1.7rem);line-height:1.35;margin:0 0 1rem;max-width:32rem}
.q:focus{outline:none}
.read{flex:none;display:inline-flex;align-items:center;gap:.4rem;font-size:.95rem;padding:.45rem .9rem}
.fig-wrap{display:flex;justify-content:center;margin:.5rem 0 1.25rem;overflow-x:auto}
.fig{max-width:100%;height:auto}
.eq{font-size:clamp(2rem,7vw,2.8rem);font-weight:700;letter-spacing:.02em;text-align:center;padding:.4rem 0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-bottom:1.25rem}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.choices.c3{grid-template-columns:1fr}.choice{font-size:1.1rem;padding:.5rem .4rem}.choice.sym{font-size:1.8rem}}
.choice{overflow-wrap:anywhere;hyphens:auto}
.choice{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:4rem;padding:.6rem;font-size:1.35rem;font-weight:700}
.choice[aria-pressed="true"]{border-color:var(--t1);background:var(--sel);box-shadow:inset 0 0 0 2px var(--t1)}
.choice.sym{font-size:2rem}
.numrow{display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem;justify-content:center}
input.num{font-size:2.2rem;width:7ch;text-align:center;font-weight:700}
.unit{font-size:1.6rem;font-weight:700;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

svg text{fill:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.f-ink{fill:var(--ink)}.f-surf{fill:var(--surface)}.f-paper{fill:var(--paper)}.f-soft{fill:var(--soft)}
.f-t1{fill:var(--t1)}.f-t2{fill:var(--t2)}.f-t3{fill:var(--t3)}.f-copper{fill:var(--copper)}.f-muted{fill:var(--muted)}
.s-ink{stroke:var(--ink)}.s-line{stroke:var(--line)}.s-muted{stroke:var(--muted)}.s-t1{stroke:var(--t1)}

.done-wrap{text-align:center;padding:2rem 0}
.done-wrap h1{margin-bottom:1rem}
.report-head{margin-bottom:1.25rem}
.report-head p{color:var(--muted);margin:0}
.rec{border-left:6px solid var(--t1);background:var(--surface);border-radius:0 14px 14px 0;padding:1rem 1.2rem;margin:0 0 1.5rem}
.rec strong{display:block;font-size:1.3rem;margin-bottom:.25rem}
.rec p{margin:0}
.tablewrap{overflow-x:auto;margin-bottom:1.5rem;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.95rem;color:var(--muted)}
.std{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-weight:700;font-size:.9rem;white-space:nowrap}
.b-PRO{background:var(--t3);color:#10261f}.b-DEV{background:var(--t2);color:#2b1f05}.b-BEG{background:var(--soft);color:var(--ink)}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
details.log summary{cursor:pointer;font-weight:700;margin-bottom:.75rem}
.report-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
@media (max-width:520px){.qhead{flex-direction:column-reverse;gap:.5rem}.card{padding:1.1rem}}
@media (prefers-reduced-motion:reduce){.progress .hex{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ============ Results form (Google Form on the school account) ============ */
const FORM = {
  url: 'https://docs.google.com/forms/d/e/1FAIpQLSfvnQS-miBLMUcj7RYBBXZJE5_2OQSKlJ9jz0-HVIHYHKVifA/formResponse',
  assessment: 'entry.1432208258', student: 'entry.671849451', recommendation: 'entry.1874033440',
  strands: 'entry.1217998323', answers: 'entry.115469363'
};
const ASSESSMENT_NAME = 'Level 4';
const STORE_KEY = 'tessie-placement-results';

/* ============ Placement rules (tune these) ============ */
const RULES = {
  // Strand rating from the 3 core items: 3 = PRO, 2 = DEV, 0-1 = BEG
  advance:   { minPro: 9, minStretch: 7 },  // try the Level 5 placement next
  levelUp:   { maxBeg: 0, minPro: 7 },      // place in Level 5
  borderline:{ maxBeg: 1, minPro: 5 },      // teacher judgment
  dropBack:  { minFloorMiss: 3 }         // place in Level 3
};

/* ============ Helpers ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a.map(String))];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>n.toFixed(1);
const fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
const NAMES=['Maya','Leo','Ava','Sam','Priya','Kenji','Rosa','Omar','Nia','Theo'];
const digits3=()=>shuffle([1,2,3,4,5,6,7,8,9]).slice(0,3);
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numName(n){const h=Math.floor(n/100),r=n%100,s=[];if(h)s.push(ONES[h]+' hundred');if(r){if(r<20)s.push(ONES[r]);else{const t=Math.floor(r/10),o=r%10;s.push(TENS[t]+(o?'-'+ONES[o]:''))}}return s.join(' ')}
const num=o=>({kind:'num',...o,answer:String(o.answer)});
function mc(o){const ch=uniq(o.choices);return {kind:'mc',...o,answer:String(o.answer),choices:o.fixed?ch:shuffle(ch)}}
function fillChoices(answer,cands,n=4){const out=[String(answer)];for(const c of cands){const s=String(c);if(!out.includes(s))out.push(s);if(out.length===n)break}return out}
const eq=s=>`<div class="eq">${s}</div>`;

/* ============ Figures (SVG) ============ */
const svg=(w,h,inner,label,scale=1)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" width="${Math.round(w*scale)}" role="img" aria-label="${label}">${inner}</svg>`;

function blocksSVG(h,t,o){let x=8,s='';
  for(let i=0;i<h;i++){s+=`<rect x="${x}" y="8" width="60" height="60" class="f-t1 s-ink" stroke-width="1.5"/>`;
    for(let k=1;k<10;k++)s+=`<line x1="${x+6*k}" y1="8" x2="${x+6*k}" y2="68" class="s-ink" stroke-width=".6" opacity=".45"/><line x1="${x}" y1="${8+6*k}" x2="${x+60}" y2="${8+6*k}" class="s-ink" stroke-width=".6" opacity=".45"/>`;
    x+=70}
  if(h)x+=6;
  for(let i=0;i<t;i++){s+=`<rect x="${x}" y="8" width="6" height="60" class="f-t3 s-ink" stroke-width="1.2"/>`;
    for(let k=1;k<10;k++)s+=`<line x1="${x}" y1="${8+6*k}" x2="${x+6}" y2="${8+6*k}" class="s-ink" stroke-width=".5" opacity=".5"/>`;
    x+=11}
  if(t)x+=10;
  for(let i=0;i<o;i++)s+=`<rect x="${x+(i%3)*10}" y="${8+Math.floor(i/3)*10}" width="7" height="7" class="f-t2 s-ink" stroke-width="1"/>`;
  return svg(x+(o?32:0)+8,76,s,'Base-ten blocks',1.35)}

function rulerSVG(bars,maxCm=15){const u=32,L=20,top=8,bh=20,gap=14,ry=top+bars.length*(bh+gap)+6,W=L*2+maxCm*u+40;let s='';
  bars.forEach((b,i)=>{const y=top+i*(bh+gap);
    s+=`<rect x="${L+b.from*u}" y="${y}" width="${(b.to-b.from)*u}" height="${bh}" rx="6" class="${b.cls} s-ink" stroke-width="1.5"/>`;
    for(const e of [b.from,b.to])s+=`<line x1="${L+e*u}" y1="${y+bh}" x2="${L+e*u}" y2="${ry}" class="s-muted" stroke-width="1.2" stroke-dasharray="3 3"/>`});
  s+=`<rect x="${L-12}" y="${ry}" width="${maxCm*u+64}" height="46" rx="4" class="f-surf s-ink" stroke-width="1.5"/>`;
  for(let c=0;c<=maxCm;c++){const x=L+c*u;
    s+=`<line x1="${x}" y1="${ry}" x2="${x}" y2="${ry+16}" class="s-ink" stroke-width="1.5"/><text x="${x}" y="${ry+36}" text-anchor="middle" font-size="14">${c}</text>`;
    if(c<maxCm)s+=`<line x1="${x+u/2}" y1="${ry}" x2="${x+u/2}" y2="${ry+8}" class="s-ink" stroke-width="1"/>`}
  s+=`<text x="${L+maxCm*u+32}" y="${ry+36}" text-anchor="middle" font-size="15" font-weight="700">cm</text>`;
  return svg(W,ry+52,s,'Centimeter ruler',1.25)}

function ribbonsSVG(lens,cls){let s='';lens.forEach((L,i)=>s+=`<rect x="10" y="${10+i*36}" width="${L*26}" height="22" rx="6" class="${cls[i]} s-ink" stroke-width="1.5"/>`);
  return svg(Math.max(...lens)*26+20,12+lens.length*36,s,'Three ribbons',1.2)}

function rectSVG(w,h){const u=26,x=70,y=34;let s=`<rect x="${x}" y="${y}" width="${w*u}" height="${h*u}" class="f-t3 s-ink" stroke-width="3"/>`;
  s+=`<text x="${x+w*u/2}" y="${y-10}" text-anchor="middle" font-size="18" font-weight="700">${w} cm</text>`;
  s+=`<text x="${x-10}" y="${y+h*u/2+6}" text-anchor="end" font-size="18" font-weight="700">${h} cm</text>`;
  return svg(x+w*u+16,y+h*u+12,s,'Rectangle',1.2)}

function clockSVG(h,m){const cx=100,cy=100;let s=`<circle cx="100" cy="100" r="92" class="f-surf s-ink" stroke-width="4"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?84:77;s+=`<line x1="${f1(cx+r1*Math.sin(a))}" y1="${f1(cy-r1*Math.cos(a))}" x2="${f1(cx+88*Math.sin(a))}" y2="${f1(cy-88*Math.cos(a))}" class="s-ink" stroke-width="${i%5?1:2.5}"/>`}
  for(let n=1;n<=12;n++){const a=n*Math.PI/6;s+=`<text x="${f1(cx+63*Math.sin(a))}" y="${f1(cy-63*Math.cos(a)+7)}" text-anchor="middle" font-size="20" font-weight="700">${n}</text>`}
  const ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+=`<line x1="100" y1="100" x2="${f1(cx+42*Math.sin(ha))}" y2="${f1(cy-42*Math.cos(ha))}" class="s-ink" stroke-width="8" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${f1(cx+72*Math.sin(ma))}" y2="${f1(cy-72*Math.cos(ma))}" class="s-ink" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<circle cx="100" cy="100" r="6" class="f-ink"/>`;
  return svg(200,200,s,'Clock face',1.15)}

const COIN={q:{v:25,r:26,c:'f-soft'},d:{v:10,r:18,c:'f-soft'},n:{v:5,r:22,c:'f-soft'},p:{v:1,r:20,c:'f-copper'}};
function coinsSVG(list){let x=8,s='';list.forEach(k=>{const c=COIN[k];
  s+=`<circle cx="${x+c.r}" cy="34" r="${c.r}" class="${c.c} s-ink" stroke-width="1.5"/><text x="${x+c.r}" y="40" text-anchor="middle" font-size="${c.r>19?16:13}" font-weight="700">${c.v}¢</text>`;x+=c.r*2+8});
  return svg(x,68,s,'Coins',1.3)}

function picGraphSVG(cats,counts,keyText){const rowH=38,lw=96,ic=26,max=Math.max(...counts),H=10+cats.length*rowH;let s='';
  cats.forEach((c,i)=>{const y=10+i*rowH;s+=`<text x="${lw-14}" y="${y+22}" text-anchor="end" font-size="16">${c}</text>`;
    for(let j=0;j<counts[i];j++)s+=`<circle cx="${lw+j*ic+12}" cy="${y+16}" r="10" class="${['f-t1','f-t2','f-t3','f-copper'][i%4]}"/>`});
  s+=`<line x1="${lw-4}" y1="6" x2="${lw-4}" y2="${H}" class="s-line" stroke-width="2"/>`;
  let extra=0;if(keyText){s+=`<circle cx="${lw+12}" cy="${H+22}" r="10" class="f-ink"/><text x="${lw+30}" y="${H+28}" font-size="16">${keyText}</text>`;extra=42}
  return svg(Math.max(lw+max*ic+24,300),H+extra+6,s,'Picture graph',1.2)}

function barGraphSVG(cats,counts,maxY=10){const x0=44,y0=232,u=20,bw=48,gap=26,W=x0+cats.length*(bw+gap)+10;let s='';
  for(let v=0;v<=maxY;v++){const y=y0-v*u;s+=`<line x1="${x0}" y1="${y}" x2="${W-6}" y2="${y}" class="s-line" stroke-width="1"/><text x="${x0-8}" y="${y+5}" text-anchor="end" font-size="13">${v}</text>`}
  cats.forEach((c,i)=>{const x=x0+gap/2+i*(bw+gap);s+=`<rect x="${x}" y="${y0-counts[i]*u}" width="${bw}" height="${counts[i]*u}" class="f-t1"/><text x="${x+bw/2}" y="${y0+22}" text-anchor="middle" font-size="14">${c}</text>`});
  s+=`<line x1="${x0}" y1="${y0-maxY*u-4}" x2="${x0}" y2="${y0}" class="s-ink" stroke-width="2"/><line x1="${x0}" y1="${y0}" x2="${W-6}" y2="${y0}" class="s-ink" stroke-width="2"/>`;
  return svg(W,y0+32,s,'Bar graph',1.15)}

function linePlotSVG(vals,counts){const x0=40,u=64,y=150,W=x0*2+(vals.length-1)*u;let s=`<line x1="${x0-24}" y1="${y}" x2="${W-x0+24}" y2="${y}" class="s-ink" stroke-width="2"/>`;
  vals.forEach((v,i)=>{const x=x0+i*u;s+=`<line x1="${x}" y1="${y-7}" x2="${x}" y2="${y+7}" class="s-ink" stroke-width="2"/><text x="${x}" y="${y+28}" text-anchor="middle" font-size="16">${v}</text>`;
    for(let k=0;k<counts[i];k++)s+=`<text x="${x}" y="${y-14-k*26}" text-anchor="middle" font-size="22" font-weight="700" class="f-t1">X</text>`});
  s+=`<text x="${W/2}" y="${y+54}" text-anchor="middle" font-size="15" class="f-muted">Pencil length (inches)</text>`;
  return svg(W,y+62,s,'Line plot',1.15)}

function arraySVG(r,c){let s='';for(let i=0;i<r;i++)for(let j=0;j<c;j++)s+=`<circle cx="${20+j*32}" cy="${20+i*32}" r="11" class="f-t3"/>`;
  return svg(c*32+8,r*32+8,s,'Array of dots',1.3)}

function polySVG(n,irregular){const cx=100,cy=100,step=2*Math.PI/n,st=Math.random()*Math.PI,pts=[];
  for(let i=0;i<n;i++){const a=st+i*step+(irregular?(Math.random()-.5)*step*.35:0),r=irregular?72*(.82+Math.random()*.18):72;pts.push(`${f1(cx+r*Math.cos(a))},${f1(cy+r*Math.sin(a))}`)}
  return svg(200,200,`<polygon points="${pts.join(' ')}" class="f-t2 s-ink" stroke-width="3" stroke-linejoin="round"/>`,'A shape',1)}

function gridSVG(r,c){const u=40;let s=`<rect x="4" y="4" width="${c*u}" height="${r*u}" class="f-t3 s-ink" stroke-width="3"/>`;
  for(let i=1;i<c;i++)s+=`<line x1="${4+i*u}" y1="4" x2="${4+i*u}" y2="${4+r*u}" class="s-ink" stroke-width="2"/>`;
  for(let i=1;i<r;i++)s+=`<line x1="4" y1="${4+i*u}" x2="${4+c*u}" y2="${4+i*u}" class="s-ink" stroke-width="2"/>`;
  return svg(c*u+8,r*u+8,s,'Rectangle split into squares',1.2)}

function fracSVG(shape,parts,shaded){let s='';
  if(shape==='circle'){const cx=90,cy=90,r=80;
    for(let i=0;i<parts;i++){const a0=-Math.PI/2+i*2*Math.PI/parts,a1=a0+2*Math.PI/parts;
      s+=`<path d="M${cx},${cy} L${f1(cx+r*Math.cos(a0))},${f1(cy+r*Math.sin(a0))} A${r},${r} 0 0 1 ${f1(cx+r*Math.cos(a1))},${f1(cy+r*Math.sin(a1))} Z" class="${i<shaded?'f-t1':'f-surf'} s-ink" stroke-width="3" stroke-linejoin="round"/>`}
    return svg(180,180,s,'Circle in equal parts',1.1)}
  const W=240,H=110,w=W/parts;
  for(let i=0;i<parts;i++)s+=`<rect x="${f1(4+i*w)}" y="4" width="${f1(w)}" height="${H}" class="${i<shaded?'f-t1':'f-surf'} s-ink" stroke-width="3"/>`;
  return svg(W+8,H+8,s,'Rectangle in equal parts',1.15)}

function fracLineSVG(b,a){const x0=34,L=420,y=46;let s=`<line x1="${x0-16}" y1="${y}" x2="${x0+L+16}" y2="${y}" class="s-ink" stroke-width="2.5"/>`;
  for(let i=0;i<=b;i++){const x=x0+L*i/b,big=i===0||i===b;s+=`<line x1="${f1(x)}" y1="${y-(big?14:9)}" x2="${f1(x)}" y2="${y+(big?14:9)}" class="s-ink" stroke-width="${big?2.5:1.8}"/>`}
  s+=`<text x="${x0}" y="${y+40}" text-anchor="middle" font-size="18" font-weight="700">0</text><text x="${x0+L}" y="${y+40}" text-anchor="middle" font-size="18" font-weight="700">1</text>`;
  s+=`<circle cx="${f1(x0+L*a/b)}" cy="${y}" r="9" class="f-t1 s-ink" stroke-width="2"/>`;
  return svg(x0*2+L,y+52,s,'Number line from 0 to 1',1.2)}

/* ============ Level 3 extras ============ */
const LEVEL=4, NEXT=5, PREV=3;
const fmtN=n=>n.toLocaleString('en-US');
const QF=['','¼','½','¾'];
const fmtQ=q=>{const w=Math.floor(q/4),r=q%4;return ((w?String(w):'')+(r?QF[r]:''))||'0'};
const eqFrac=(a,b,c,d)=>a*d===b*c;
const AH=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="f-ink"/></marker></defs>`;

function scaledBarSVG(cats,vals,step,maxV){const x0=48,y0=232,H=200,u=H/maxV,bw=54,gap=26,W=x0+cats.length*(bw+gap)+10;let s='';
  for(let v=0;v<=maxV;v+=step){const y=y0-v*u;s+=`<line x1="${x0}" y1="${f1(y)}" x2="${W-6}" y2="${f1(y)}" class="s-line" stroke-width="1"/><text x="${x0-8}" y="${f1(y+5)}" text-anchor="end" font-size="13">${v}</text>`}
  cats.forEach((c,i)=>{const x=x0+gap/2+i*(bw+gap);s+=`<rect x="${x}" y="${f1(y0-vals[i]*u)}" width="${bw}" height="${f1(vals[i]*u)}" class="f-t1"/><text x="${x+bw/2}" y="${y0+22}" text-anchor="middle" font-size="13">${c}</text>`});
  s+=`<line x1="${x0}" y1="${y0-H-4}" x2="${x0}" y2="${y0}" class="s-ink" stroke-width="2"/><line x1="${x0}" y1="${y0}" x2="${W-6}" y2="${y0}" class="s-ink" stroke-width="2"/>`;
  return svg(W,y0+32,s,'Bar graph',1.1)}

function halfPicSVG(cats,halves,keyText){const rowH=40,lw=86,ic=28,maxI=Math.max(...halves.map(h=>Math.ceil(h/2))),H=10+cats.length*rowH,cls=['f-t1','f-t2','f-t3'];let s='';
  cats.forEach((c,i)=>{const y=10+i*rowH,cy=y+17,full=Math.floor(halves[i]/2);
    s+=`<text x="${lw-14}" y="${y+23}" text-anchor="end" font-size="16">${c}</text>`;
    for(let j=0;j<full;j++)s+=`<circle cx="${lw+j*ic+12}" cy="${cy}" r="11" class="${cls[i%3]}"/>`;
    if(halves[i]%2){const cx=lw+full*ic+12;s+=`<path d="M${cx},${cy-11} A11,11 0 0 0 ${cx},${cy+11} Z" class="${cls[i%3]}"/>`}});
  s+=`<line x1="${lw-4}" y1="6" x2="${lw-4}" y2="${H}" class="s-line" stroke-width="2"/>`;
  s+=`<circle cx="${lw+12}" cy="${H+22}" r="11" class="f-ink"/><text x="${lw+30}" y="${H+28}" font-size="16">${keyText}</text>`;
  return svg(Math.max(lw+maxI*ic+24,300),H+46,s,'Picture graph',1.2)}

function inchRulerSVG(q,maxIn=5){const U=88,L=24,top=10,bh=20,ry=top+bh+18,W=L+maxIn*U+60;
  let s=`<rect x="${L}" y="${top}" width="${q*U/4}" height="${bh}" rx="5" class="f-t2 s-ink" stroke-width="1.5"/>`;
  for(const e of [0,q])s+=`<line x1="${L+e*U/4}" y1="${top+bh}" x2="${L+e*U/4}" y2="${ry}" class="s-muted" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  s+=`<rect x="${L-12}" y="${ry}" width="${maxIn*U+64}" height="50" rx="4" class="f-surf s-ink" stroke-width="1.5"/>`;
  for(let k=0;k<=maxIn*4;k++){const x=L+k*U/4,len=k%4===0?22:k%2===0?15:9;
    s+=`<line x1="${x}" y1="${ry}" x2="${x}" y2="${ry+len}" class="s-ink" stroke-width="${k%4?1.2:1.8}"/>`;
    if(k%4===0)s+=`<text x="${x}" y="${ry+42}" text-anchor="middle" font-size="15">${k/4}</text>`}
  s+=`<text x="${L+maxIn*U+30}" y="${ry+42}" text-anchor="middle" font-size="15" font-weight="700">in</text>`;
  return svg(W,ry+56,s,'Inch ruler',1.25)}

function beakerSVG(v){const x=86,top=20,h=250,w=110,max=10,u=h/max;
  let s=`<rect x="${x}" y="${f1(top+h-v*u)}" width="${w}" height="${f1(v*u)}" class="f-t1" opacity=".5"/>`;
  s+=`<line x1="${x}" y1="${f1(top+h-v*u)}" x2="${x+w}" y2="${f1(top+h-v*u)}" class="s-t1" stroke-width="3"/>`;
  s+=`<path d="M${x},${top-12} V${top+h} H${x+w} V${top-12}" fill="none" class="s-ink" stroke-width="3" stroke-linejoin="round"/>`;
  for(let i=1;i<=max;i++){const y=top+h-i*u;s+=`<line x1="${x}" y1="${f1(y)}" x2="${x+(i%2?14:28)}" y2="${f1(y)}" class="s-ink" stroke-width="2"/>`;
    if(i%2===0)s+=`<text x="${x-10}" y="${f1(y+5)}" text-anchor="end" font-size="16">${i} L</text>`}
  return svg(x+w+24,top+h+14,s,'Measuring container',1)}

function scaleSVG(v){const x0=34,L=440,y=60,max=1000,u=L/max;
  let s=`<rect x="${x0-18}" y="${y-30}" width="${L+36}" height="66" rx="8" class="f-surf s-ink" stroke-width="2"/>`;
  for(let g=0;g<=max;g+=100){const x=x0+g*u,big=g%200===0;s+=`<line x1="${f1(x)}" y1="${y-30}" x2="${f1(x)}" y2="${y-30+(big?20:12)}" class="s-ink" stroke-width="${big?2:1.4}"/>`;
    if(big)s+=`<text x="${f1(x)}" y="${y+16}" text-anchor="middle" font-size="14">${g}</text>`}
  const px=x0+v*u;s+=`<path d="M${f1(px)},${y-30} L${f1(px-9)},${y-52} L${f1(px+9)},${y-52} Z" class="f-t1 s-ink" stroke-width="1.5"/>`;
  s+=`<text x="${x0+L/2}" y="${y+56}" text-anchor="middle" font-size="15" class="f-muted">grams</text>`;
  return svg(x0*2+L,y+64,s,'Scale',1.15)}

function lShapeSVG(W,H,cw,ch){const u=34;let s='';
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(r<ch&&c>=W-cw)continue;s+=`<rect x="${4+c*u}" y="${4+r*u}" width="${u}" height="${u}" class="f-t3 s-ink" stroke-width="1.5"/>`}
  return svg(W*u+8,H*u+8,s,'Shape made of squares',1.1)}

function lineKindSVG(kind){const y=70,dot=(x,yy)=>`<circle cx="${x}" cy="${yy}" r="6" class="f-ink"/>`;let s=AH;
  if(kind==='line')s+=`<line x1="34" y1="${y}" x2="326" y2="${y}" class="s-ink" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>`;
  if(kind==='ray')s+=`<line x1="44" y1="${y}" x2="326" y2="${y}" class="s-ink" stroke-width="3" marker-end="url(#ah)"/>`+dot(44,y);
  if(kind==='line segment')s+=`<line x1="44" y1="${y}" x2="316" y2="${y}" class="s-ink" stroke-width="3"/>`+dot(44,y)+dot(316,y);
  if(kind==='angle')s+=`<line x1="70" y1="110" x2="326" y2="110" class="s-ink" stroke-width="3" marker-end="url(#ah)"/><line x1="70" y1="110" x2="250" y2="18" class="s-ink" stroke-width="3" marker-end="url(#ah)"/>`+dot(70,110);
  const rot=R(-25,25);return svg(360,130,`<g transform="rotate(${rot} 180 65)">${s}</g>`,'A figure',1.1)}

function linesPairSVG(kind){const cx=180,cy=120,len=140,t=R(-35,35)*Math.PI/180;let s=AH;
  const ln=(x,y,a)=>`<line x1="${f1(x-len*Math.cos(a))}" y1="${f1(y-len*Math.sin(a))}" x2="${f1(x+len*Math.cos(a))}" y2="${f1(y+len*Math.sin(a))}" class="s-ink" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>`;
  if(kind==='parallel'){const nx=-Math.sin(t)*38,ny=Math.cos(t)*38;s+=ln(cx+nx,cy+ny,t)+ln(cx-nx,cy-ny,t)}
  else if(kind==='perpendicular'){const t2=t+Math.PI/2;s+=ln(cx,cy,t)+ln(cx,cy,t2);
    const d1=[Math.cos(t)*16,Math.sin(t)*16],d2=[Math.cos(t2)*16,Math.sin(t2)*16];
    s+=`<path d="M${f1(cx+d1[0])},${f1(cy+d1[1])} L${f1(cx+d1[0]+d2[0])},${f1(cy+d1[1]+d2[1])} L${f1(cx+d2[0])},${f1(cy+d2[1])}" fill="none" class="s-ink" stroke-width="2"/>`}
  else{const t2=t+R(35,60)*Math.PI/180;s+=ln(cx,cy,t)+ln(cx,cy,t2)}
  return svg(360,240,s,'Two lines',1.05)}

const L3core=(id,k)=>L3STRANDS.find(s=>s.id===id).core[k]();
function toMixed(n,d){const w=Math.floor(n/d),r=n%d;return r?(w?`${w} ${r}/${d}`:`${r}/${d}`):String(w)}
const hund=n=>(n/100).toFixed(2);

function protractorSVG(baseLeft,phi){const cx=220,cy=210,R0=190;let s=`<path d="M${cx-R0},${cy} A${R0},${R0} 0 0 1 ${cx+R0},${cy} Z" class="f-surf s-ink" stroke-width="2"/>`;
  for(let a=0;a<=180;a+=5){const t=a*Math.PI/180,c=Math.cos(t),sn=Math.sin(t),len=a%10?9:16;
    s+=`<line x1="${f1(cx+R0*c)}" y1="${f1(cy-R0*sn)}" x2="${f1(cx+(R0-len)*c)}" y2="${f1(cy-(R0-len)*sn)}" class="s-ink" stroke-width="${a%10?1:1.6}"/>`;
    if(a%10===0){const lift=(a===0||a===180)?-12:0;s+=`<text x="${f1(cx+(R0-30)*c)}" y="${f1(cy-(R0-30)*sn+4+lift)}" text-anchor="middle" font-size="11">${180-a}</text>`;
      s+=`<text x="${f1(cx+(R0-54)*c)}" y="${f1(cy-(R0-54)*sn+4+lift)}" text-anchor="middle" font-size="11" class="f-muted">${a}</text>`}}
  const ray=t=>`<line x1="${cx}" y1="${cy}" x2="${f1(cx+(R0+14)*Math.cos(t))}" y2="${f1(cy-(R0+14)*Math.sin(t))}" class="s-t1" stroke-width="4" stroke-linecap="round"/>`;
  s+=ray(baseLeft?Math.PI:0)+ray(phi*Math.PI/180)+`<circle cx="${cx}" cy="${cy}" r="5" class="f-ink"/>`;
  return svg(440,cy+14,s,'Protractor measuring an angle',1.25)}

function straightAngleSVG(psi,knownRight,val){const cx=220,cy=150,t=psi*Math.PI/180;let s=AH;
  s+=`<line x1="30" y1="${cy}" x2="410" y2="${cy}" class="s-ink" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${f1(cx+150*Math.cos(t))}" y2="${f1(cy-150*Math.sin(t))}" class="s-ink" stroke-width="3" marker-end="url(#ah)"/><circle cx="${cx}" cy="${cy}" r="5" class="f-ink"/>`;
  const arc=(a0,a1,r)=>`<path d="M${f1(cx+r*Math.cos(a0))},${f1(cy-r*Math.sin(a0))} A${r},${r} 0 0 0 ${f1(cx+r*Math.cos(a1))},${f1(cy-r*Math.sin(a1))}" fill="none" class="s-t1" stroke-width="2.5"/>`;
  s+=arc(0,t,36)+arc(t,Math.PI,46);
  const lab=(mid,r,txt)=>`<text x="${f1(cx+r*Math.cos(mid))}" y="${f1(cy-r*Math.sin(mid)+6)}" text-anchor="middle" font-size="18" font-weight="700">${txt}</text>`;
  s+=lab(t/2,66,knownRight?val+'°':'?')+lab((t+Math.PI)/2,74,knownRight?'?':val+'°');
  return svg(440,cy+16,s,'Angles on a straight line',1.15)}

function polyPtsSVG(pts,extra=''){return svg(200,200,`<polygon points="${pts.map(p=>p.map(f1).join(',')).join(' ')}" class="f-t2 s-ink" stroke-width="3" stroke-linejoin="round"/>${extra}`,'A shape',1.05)}
const regPts=(n,start=-90)=>Array.from({length:n},(_,i)=>{const a=(start+i*360/n)*Math.PI/180;return [100+80*Math.cos(a),104+80*Math.sin(a)]});

function triangleSVG(kind){let A,B;
  if(kind==='right'){if(R(0,1)){A=90;B=R(30,60)}else{B=90;A=R(30,60)}}
  else if(kind==='obtuse'){const big=R(105,130),small=R(20,175-big-20);if(R(0,1)){A=big;B=small}else{B=big;A=small}}
  else{do{A=R(48,80);B=R(48,80)}while(180-A-B>=85||180-A-B<35)}
  const C=180-A-B,rad=Math.PI/180,base=1,len=base*Math.sin(B*rad)/Math.sin(C*rad),P=[[0,0],[base,0],[len*Math.cos(A*rad),len*Math.sin(A*rad)]];
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mxy=Math.max(...ys),sc=Math.min(320/(mxx-mnx),170/mxy);
  const Q=P.map(([x,y])=>[30+(x-mnx)*sc,190-y*sc]);
  let mark='';const ri=A===90?0:B===90?1:-1;
  if(ri>=0){const v=Q[ri],o=Q[1-ri],w=Q[2],u1=[(o[0]-v[0]),(o[1]-v[1])],u2=[(w[0]-v[0]),(w[1]-v[1])],n1=Math.hypot(...u1),n2=Math.hypot(...u2),k=16;
    const a=[v[0]+u1[0]/n1*k,v[1]+u1[1]/n1*k],b=[v[0]+u2[0]/n2*k,v[1]+u2[1]/n2*k];
    mark=`<path d="M${f1(a[0])},${f1(a[1])} L${f1(a[0]+b[0]-v[0])},${f1(a[1]+b[1]-v[1])} L${f1(b[0])},${f1(b[1])}" fill="none" class="s-ink" stroke-width="2"/>`}
  return svg(380,205,`<polygon points="${Q.map(p=>p.map(f1).join(',')).join(' ')}" class="f-t3 s-ink" stroke-width="3" stroke-linejoin="round"/>${mark}`,'A triangle',1.1)}

function lShapeLabSVG(W,H,cw,ch){const u=Math.min(300/W,200/H),x0=70,y0=30,X=v=>f1(x0+v*u),Y=v=>f1(y0+v*u);
  const pts=[[0,0],[W-cw,0],[W-cw,ch],[W,ch],[W,H],[0,H]];
  let s=`<polygon points="${pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" class="f-t3 s-ink" stroke-width="3" stroke-linejoin="round"/>`;
  const t=(x,y,txt,anc='middle')=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-size="16" font-weight="700">${txt}</text>`;
  s+=t(X((W-cw)/2),f1(y0-8),`${W-cw} m`)+t(X(W/2),f1(y0+H*u+22),`${W} m`)+t(f1(x0-8),Y(H/2),`${H} m`,'end')+t(f1(x0+W*u+8),Y((ch+H)/2),`${H-ch} m`,'start');
  return svg(x0+W*u+70,y0+H*u+34,s,'A shape made of rectangles',1.1)}

function lineGraphSVG(labels,vals){const lo=Math.floor((Math.min(...vals)-2)/4)*4,hi=Math.ceil((Math.max(...vals)+2)/4)*4,x0=56,y0=236,W=500,H=196,dx=(W-x0-30)/(labels.length-1),u=H/(hi-lo);let s='';
  for(let v=lo;v<=hi;v+=2){const y=y0-(v-lo)*u;s+=`<line x1="${x0}" y1="${f1(y)}" x2="${W-14}" y2="${f1(y)}" class="s-line" stroke-width="${(v-lo)%4?0.7:1.2}"/>`;

  labels.forEach((l,i)=>{s+=`<text x="${f1(x0+12+i*dx)}" y="${y0+22}" text-anchor="middle" font-size="12">${l}</text>`});
  s+=`<polyline points="${vals.map((v,i)=>f1(x0+12+i*dx)+','+f1(y0-(v-lo)*u)).join(' ')}" fill="none" class="s-t1" stroke-width="3"/>`;
  vals.forEach((v,i)=>s+=`<circle cx="${f1(x0+12+i*dx)}" cy="${f1(y0-(v-lo)*u)}" r="5" class="f-t1"/>`);
  s+=`<line x1="${x0}" y1="${y0-H-4}" x2="${x0}" y2="${y0}" class="s-ink" stroke-width="2"/><line x1="${x0}" y1="${y0}" x2="${W-14}" y2="${y0}" class="s-ink" stroke-width="2"/>`;
  s+=`<text x="${x0-8}" y="${y0-H-10}" text-anchor="end" font-size="13" font-weight="700">°F</text>`;

function coordSVG(x,y){const x0=40,y0=300,u=32;let s='';

  s+=`<line x1="${x0}" y1="${y0}" x2="${x0+8*u+8}" y2="${y0}" class="s-ink" stroke-width="2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0-8*u-8}" class="s-ink" stroke-width="2"/>`;
  s+=`<circle cx="${x0+x*u}" cy="${y0-y*u}" r="7" class="f-t1"/><text x="${x0+x*u+11}" y="${y0-y*u-9}" font-size="17" font-weight="700">P</text>`;

{ id:'C', name:'Fractions and mixed numbers', stds:'4.NF.A.2, 4.NF.B.3, 4.NF.B.4', ch:'Ch. 3',
  core:[

      const best=fr.reduce((a,b)=>b[2]>a[2]?b:a);return mc({std:'4.NF.A.2',q:'Which fraction is the greatest?',answer:`${best[0]}/${best[1]}`,choices:fr.map(f=>`${f[0]}/${f[1]}`)})},
    ()=>{const d=pick([3,4,5,6,8]);
      if(R(0,1)){const w1=R(1,4),w2=R(1,3),n1=R(2,d-1),n2=R(d-n1+1,d-1);if(n2<=d-n1||n2>d-1)return STRANDS[2].core[1]();
        const right=toMixed((w1+w2)*d+n1+n2,d);
        return mc({std:'4.NF.B.3',q:`Add. <strong>${w1} ${n1}/${d} + ${w2} ${n2}/${d}</strong>`,say:`What is ${w1} and ${n1} ${d}ths plus ${w2} and ${n2} ${d}ths?`,answer:right,choices:fillChoices(right,[`${w1+w2} ${n1+n2-d}/${d}`,`${w1+w2} ${n1+n2}/${2*d}`,`${w1+w2+1} ${n1+n2}/${d}`,`${w1+w2+2} ${n1+n2-d}/${d}`])})}
      const w1=R(4,7),w2=R(1,w1-2),n1=R(1,d-2),n2=R(n1+1,d-1),right=toMixed((w1*d+n1)-(w2*d+n2),d);

    return mc({std:'5.NF.A.1',q:`Add. <strong>${a}/${b} + ${c}/${d}</strong>`,say:`What is ${a} over ${b} plus ${c} over ${d}?`,answer:right,choices:fillChoices(right,[`${a+c}/${b+d}`,`${a+c}/${b*d}`,`${a*d+b*c}/${b+d}`,`${a*c}/${b*d}`])})},

{ id:'D', name:'Decimals', stds:'4.NF.C.5, 4.NF.C.6, 4.NF.C.7', ch:'Ch. 4',

    ()=>{const w=R(1,9);let h;do{h=R(1,99)}while(h%10===0);const hs=String(h).padStart(2,'0'),right=`${w}.${hs}`;

/* ============ Saving results ============ */
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return []}}
function writeSaved(list){try{localStorage.setItem(STORE_KEY,JSON.stringify(list.slice(-200)))}catch(e){}}
function buildPayload(){const rec=recommend();
  const strands=STRANDS.map((st,i)=>{const r=S.results[i];let t=`${st.name}: ${RATING[r.rating]} ${r.score}/3`;
    if(r.follow)t+=`, ${r.follow.type==='stretch'?`Level ${NEXT} stretch`:`Level ${PREV} follow-up`} ${r.follow.ok?'correct':'missed'}`;return t}).join('\n');
  const answers=S.log.map((l,i)=>`${i+1}. [${l.strandName}, ${l.type}, ${l.std}] ${l.q} | answer: ${l.answer} | student: ${l.given} | ${l.ok?'correct':'wrong'}`).join('\n');
  return {id:Date.now()+'-'+Math.random().toString(36).slice(2,7),assessment:ASSESSMENT_NAME,student:S.name,recommendation:rec.t+'. '+rec.d,strands,answers,sent:false}}
async function sendPayload(p){const body=new URLSearchParams();
  body.append(FORM.assessment,p.assessment);body.append(FORM.student,p.student);body.append(FORM.recommendation,p.recommendation);
  body.append(FORM.strands,p.strands);body.append(FORM.answers,p.answers);
  await fetch(FORM.url,{method:'POST',mode:'no-cors',body});return true}
async function saveResult(){const p=buildPayload();const list=loadSaved();list.push(p);writeSaved(list);
  try{await sendPayload(p);p.sent=true}catch(e){p.sent=false}
  const l2=loadSaved();const m=l2.find(x=>x.id===p.id);if(m){m.sent=p.sent;writeSaved(l2)}
  S.saveStatus=p.sent?'sent':'local';const el=document.getElementById('savestatus');if(el)el.innerHTML=statusText()}
async function retryUnsent(){const list=loadSaved();let changed=false;
  for(const p of list.filter(x=>!x.sent)){try{await sendPayload(p);p.sent=true;changed=true}catch(e){break}}
  if(changed)writeSaved(list)}
function statusText(){return S.saveStatus==='sent'?'<span class="ok">Sent to the results sheet.</span>':S.saveStatus==='local'?'<span class="no">Couldn’t reach the results sheet. Saved on this computer; it will send automatically the next time this page opens with internet.</span>':'Saving…'}

function hexes(){const r=17,dx=r*1.5,hh=r*Math.sin(Math.PI/3),n=STRANDS.length,W=dx*(n-1)+2*r+6,H=hh*3+6,fills=['f-t1','f-t2','f-t3'];let s='';
  for(let i=0;i<n;i++){const cx=r+3+i*dx,cy=3+hh+(i%2?hh:0);let pts=[];for(let k=0;k<6;k++){const a=k*Math.PI/3;pts.push(`${f1(cx+r*Math.cos(a))},${f1(cy+r*Math.sin(a))}`)}
    const done=i<S.si,cur=i===S.si;s+=`<polygon class="hex ${done?fills[i%3]:'f-surf'} ${cur?'s-t1':'s-line'}" stroke-width="${cur?3.5:2}" points="${pts.join(' ')}"/>`}
  return `<svg width="${Math.round(W*1.25)}" viewBox="0 0 ${f1(W)} ${f1(H)}" role="img" aria-label="Part ${S.si+1} of ${n}">${s}</svg>`}

function renderStart(){
  app.innerHTML=`${brand()}
  <p style="margin:0 0 .5rem;font-size:1rem"><a href="assess.html" style="color:var(--muted)">All assessments</a></p>
  <h1>Math check-in</h1>
  <p class="lede">Some questions will feel easy and some will feel tricky. That’s how it’s supposed to work. Do your best, and it’s fine to say “I’m not sure.”</p>
  <label for="nm">Your name</label>
  <input type="text" id="nm" autocomplete="off">
  <label class="check"${canSpeak?'':' hidden'}><input type="checkbox" id="auto"> Read each question out loud</label>
  <button class="primary" id="go" disabled>Start</button>
  <details class="teacher-note"><summary>For teachers</summary>
    <p>Prototype Level 4 placement check, aligned to the Level 4 assessment grids (Ch. 1 to 9). Nine strands, three core items each. A strand with 3 of 3 correct gets one Level 5 stretch item; a strand with 0 or 1 correct gets one Level 3 follow-up. Students see no right or wrong feedback.</p>
    <p>Numbers are generated fresh every time, so each student (and each retake) gets a different form. The report appears at the end behind a “Teacher report” button.</p>
  </details>`;
  const nm=document.getElementById('nm'),go=document.getElementById('go');
  nm.addEventListener('input',()=>go.disabled=!nm.value.trim());
  nm.addEventListener('keydown',e=>{if(e.key==='Enter'&&nm.value.trim())go.click()});
  go.onclick=()=>{S={name:nm.value.trim(),date:new Date(),si:0,ci:0,phase:'core',log:[],results:[],auto:canSpeak&&document.getElementById('auto').checked,cur:null};nextItem()};
  nm.focus();
}

function nextItem(){const st=STRANDS[S.si];const gen=S.phase==='core'?st.core[S.ci]:st[S.phase];S.cur={...gen(),type:S.phase};renderItem()}

function plain(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent}
function speak(it){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((it.say||plain(it.q)).replace(/−/g,' minus ').replace(/¢/g,' cents'));u.rate=.9;speechSynthesis.speak(u)}

function renderItem(){const it=S.cur;let given=null;
  app.innerHTML=`${brand()}<div class="progress">${hexes()}</div>
  <section class="card">
    <div class="qhead"><p class="q" id="q" tabindex="-1">${it.q}</p>${canSpeak?`<button class="ghost read" id="read" type="button"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="f-ink"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" class="s-ink" stroke-width="2" stroke-linecap="round"/></svg>Read to me</button>`:''}</div>
    ${it.fig?`<div class="fig-wrap">${it.fig}</div>`:''}
    <div id="ans"></div>
    <div class="actions"><button class="ghost" id="skip" type="button">I’m not sure</button><button class="primary" id="next" type="button" disabled>Next</button></div>
  </section>`;
  const ans=document.getElementById('ans'),next=document.getElementById('next');
  if(it.kind==='mc'){const wrap=document.createElement('div');wrap.className='choices'+(it.choices.length===3?' c3':'');wrap.setAttribute('role','group');wrap.setAttribute('aria-label','Answer choices');
    it.choices.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='choice'+(it.sym?' sym':'');b.textContent=c;b.setAttribute('aria-pressed','false');
      if(it.sym)b.setAttribute('aria-label',{'<':'less than','=':'equal to','>':'greater than'}[c]);
      b.onclick=()=>{wrap.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');given=c;next.disabled=false};wrap.appendChild(b)});
    ans.appendChild(wrap);document.getElementById('q').focus();
  }else{ans.innerHTML=`<div class="numrow">${it.pre?`<span class="unit">${it.pre}</span>`:''}<input class="num" id="num" inputmode="${it.dec?'decimal':'numeric'}" autocomplete="off" aria-label="Your answer">${it.unit?`<span class="unit">${it.unit}</span>`:''}</div>`;
    const inp=document.getElementById('num');inp.addEventListener('input',()=>{inp.value=it.dec?inp.value.replace(/[^\d.]/g,'').slice(0,8):inp.value.replace(/[^\d]/g,'').slice(0,6);given=inp.value;next.disabled=!inp.value});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value)next.click()});inp.focus()}
  next.onclick=()=>record(given);
  document.getElementById('skip').onclick=()=>record(null);
  const rd=document.getElementById('read');if(rd)rd.onclick=()=>speak(it);
  if(S.auto)speak(it);
}

function record(given){if(canSpeak)speechSynthesis.cancel();const it=S.cur,st=STRANDS[S.si];
  const ok=given!==null&&String(given).trim()!==''&&(it.dec?Math.abs(parseFloat(given)-parseFloat(it.answer))<1e-6:String(given).trim()===it.answer);
  S.log.push({strand:st.id,strandName:st.name,type:it.type,std:it.std,q:(it.say||plain(it.q))+(it.fig&&it.fig.startsWith('<div class="eq">')&&!it.say?' '+plain(it.fig):''),answer:it.answer,given:given===null?'(not sure)':given,ok});
  advance()}

function advance(){const st=STRANDS[S.si];
  if(S.phase==='core'){S.ci++;if(S.ci<st.core.length)return nextItem();
    const score=S.log.filter(l=>l.strand===st.id&&l.type==='core'&&l.ok).length;
    S.results[S.si]={score,rating:score===3?'PRO':score===2?'DEV':'BEG',follow:null};
    if(score===3){S.phase='stretch';return nextItem()}
    if(score<=1){S.phase='floor';return nextItem()}
  }else{S.results[S.si].follow={type:S.phase,ok:S.log[S.log.length-1].ok}}
  S.si++;S.ci=0;S.phase='core';
  if(S.si>=STRANDS.length)return renderDone();
  nextItem()}

function renderDone(){
  S.saveStatus='saving';saveResult();
  app.innerHTML=`${brand()}<div class="done-wrap"><h1>All done, ${esc(S.name)}!</h1><p class="lede" style="margin:0 auto 2rem">Please let your teacher know you finished.</p><button class="ghost" id="tr" type="button">Teacher report</button></div>`;
  document.getElementById('tr').onclick=renderReport;document.getElementById('tr').focus()}

const RATING={PRO:'Proficient',DEV:'Developing',BEG:'Beginning'};
function recommend(){const res=S.results,n=STRANDS.length,pro=res.filter(r=>r.rating==='PRO').length,beg=res.filter(r=>r.rating==='BEG').length;
  const stretchOk=res.filter(r=>r.follow&&r.follow.type==='stretch'&&r.follow.ok).length;
  const floorMiss=STRANDS.filter((s,i)=>res[i].follow&&res[i].follow.type==='floor'&&!res[i].follow.ok).map(s=>s.name.toLowerCase());
  const notPro=STRANDS.filter((s,i)=>res[i].rating!=='PRO').map(s=>s.name.toLowerCase());
  const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  if(pro>=RULES.advance.minPro&&stretchOk>=RULES.advance.minStretch)return{t:`Level ${NEXT} is likely too easy`,d:`Proficient in all ${n} strands and ${stretchOk} of ${n} Level ${NEXT} stretch items correct. Give the Level ${NEXT} placement check next.`};
  if(beg<=RULES.levelUp.maxBeg&&pro>=RULES.levelUp.minPro)return{t:`Place in Level ${NEXT}`,d:notPro.length?`Quick review may help in ${list(notPro)}. Level ${NEXT} stretch items correct: ${stretchOk}.`:`Level ${NEXT} stretch items correct: ${stretchOk} of ${pro}.`};
  if(beg<=RULES.borderline.maxBeg&&pro>=RULES.borderline.minPro)return{t:`Teacher judgment: Level ${NEXT} with support, or Level ${LEVEL}`,d:`Not yet proficient in ${list(notPro)}.`};
  if(floorMiss.length>=RULES.dropBack.minFloorMiss)return{t:`Place in Level ${PREV}`,d:`Missed the Level ${PREV} follow-up in ${floorMiss.length} strands (${list(floorMiss)}). Gaps this wide would make Level ${LEVEL} hard to start. Confirm with the Level ${PREV} placement check.`};
  return{t:`Place in Level ${LEVEL}`,d:`Proficient in ${pro} of ${n} strands.`+(floorMiss.length?` Also missed the Level ${PREV} follow-up in ${list(floorMiss)}; consider giving the Level ${PREV} placement check.`:'')}}

function followText(f){if(!f)return '<span class="std">Not needed</span>';const lvl=f.type==='stretch'?`Level ${NEXT} stretch`:`Level ${PREV} follow-up`;return `${lvl}: <span class="${f.ok?'ok':'no'}">${f.ok?'correct':'missed'}</span>`}

function renderReport(){const rec=recommend(),date=S.date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  const rows=STRANDS.map((s,i)=>{const r=S.results[i];return `<tr><td><strong>${s.name}</strong><br><span class="std">${s.stds} (${s.ch})</span></td><td>${r.score} of 3</td><td><span class="badge b-${r.rating}">${RATING[r.rating]}</span></td><td>${followText(r.follow)}</td></tr>`}).join('');
  const logRows=S.log.map(l=>`<tr><td>${l.strand}</td><td>${l.type==='core'?'Core':l.type==='stretch'?`Stretch (L${NEXT})`:`Follow-up (L${PREV})`}</td><td class="std">${l.std}</td><td>${esc(l.q)}</td><td>${esc(l.answer)}</td><td>${esc(l.given)}</td><td class="${l.ok?'ok':'no'}">${l.ok?'Yes':'No'}</td></tr>`).join('');
  app.innerHTML=`${brand()}
  <div class="report-head"><h2>${esc(S.name)}: Level 4 placement report</h2><p>${date}, ${S.log.length} questions</p></div>
  <div class="rec"><strong>${rec.t}</strong><p>${rec.d}</p></div>
  <p id="savestatus" style="font-size:1rem">${statusText()}</p>
  <div class="tablewrap"><table><thead><tr><th>Strand</th><th>Core</th><th>Rating</th><th>Follow-up</th></tr></thead><tbody>${rows}</tbody></table></div>
  <details class="log"><summary>Every question and answer</summary>
    <div class="tablewrap"><table><thead><tr><th>Strand</th><th>Type</th><th>Standard</th><th>Question</th><th>Answer</th><th>Student</th><th>Correct</th></tr></thead><tbody>${logRows}</tbody></table></div>
  </details>
  <div class="report-actions"><button class="primary" id="copy" type="button">Copy results for a spreadsheet</button><button class="ghost" id="again" type="button">Start a new student</button></div>`;
  document.getElementById('copy').onclick=copyResults;
  document.getElementById('again').onclick=()=>{S=null;renderStart()}}

function copyResults(){const d=S.date.toISOString().slice(0,10),rec=recommend();
  const lines=[['Student','Date','Strand','Standards','Core score','Rating','Follow-up','Follow-up result','Recommendation'].join('\t')];
  STRANDS.forEach((s,i)=>{const r=S.results[i];lines.push([S.name,d,s.name,s.stds,`${r.score}/3`,RATING[r.rating],r.follow?(r.follow.type==='stretch'?`Level ${NEXT} stretch`:`Level ${PREV} follow-up`):'',r.follow?(r.follow.ok?'correct':'missed'):'',i===0?rec.t:''].join('\t'))});
  lines.push('');lines.push(['Student','Strand','Type','Standard','Question','Answer','Student answer','Correct'].join('\t'));
  S.log.forEach(l=>lines.push([S.name,l.strandName,l.type,l.std,l.q,l.answer,l.given,l.ok?'yes':'no'].join('\t')));
  const text=lines.join('\n'),btn=document.getElementById('copy');
  const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy results for a spreadsheet',2000)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback()}

if(app){renderStart();retryUnsent()}
if(typeof module!=='undefined')module.exports={STRANDS};
</script>
</body>
</html>
